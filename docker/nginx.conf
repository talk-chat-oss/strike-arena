events {
  worker_connections 1024;
}

http {
  server {
    listen 80;

    location /rest/v1/ {
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, apikey, Prefer, X-Client-Info, Range' always;
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
      }

      proxy_pass http://strike-arena-rest:3000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_hide_header 'Access-Control-Allow-Origin';
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, apikey, Prefer, X-Client-Info, Range' always;
      add_header 'Access-Control-Expose-Headers' 'Content-Range, Range-Unit' always;
    }

    location / {
      return 200 '{"service":"strike-arena-supabase-local","status":"online"}';
      add_header Content-Type application/json;
    }
  }
}
